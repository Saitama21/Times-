<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09131a"><meta name="apple-mobile-web-app-capable" content="yes"><title>Times — CNC</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20261123-3"><link rel="icon" type="image/png" sizes="180x180" href="./apple-touch-icon.png?v=20261123-3"><meta name="apple-mobile-web-app-title" content="Times CNC"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#081117;color:#edf8fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -10%,#1b3c43 0%,transparent 45%),#081117}.app-shell{min-height:100dvh;max-width:540px;margin:auto;padding:25px 19px calc(110px + env(safe-area-inset-bottom))}.eyebrow{color:#61e9ce;font-size:11px;letter-spacing:3px;font-weight:800}.header{display:flex;align-items:center;gap:14px;margin:12px 0 25px}.logo{width:57px;height:57px;border:1px solid #4c8a8a;border-radius:18px;display:grid;place-items:center;font-size:31px;background:#16323a}h1{font-size:27px;letter-spacing:-1px;line-height:1.07;margin:0}.sub{font-size:12px;color:#8ca5ae;margin-top:7px}.panel{border:1px solid #314851;border-radius:25px;padding:20px;background:linear-gradient(145deg,#1a2b34,#101d25);box-shadow:0 16px 40px #0004;margin-bottom:16px}.panel-title{font-size:12px;color:#85a5ae;text-transform:uppercase;letter-spacing:2px;font-weight:800;margin:0 0 18px}.field{margin:0 0 20px}.field:last-child{margin:0}label{display:block;font-size:14px;color:#c2d6da;margin-bottom:9px;font-weight:650}.time-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.unit{font-size:10px;color:#83a2aa;text-align:center;margin-top:5px}.field input{width:100%;min-width:0;height:62px;border:1px solid #47616a;background:#08151c;color:#fff;border-radius:15px;font-size:29px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums;outline:none}.field input:focus{border-color:#54e8cc;box-shadow:0 0 0 2px #54e8cc22}.qty input{text-align:left;padding-left:18px}.toggle-line{display:flex;align-items:center;justify-content:space-between;gap:15px}.toggle-line label{margin:0}.toggle{appearance:none;width:50px;height:29px;border-radius:30px;background:#35454b;position:relative;flex-shrink:0}.toggle:before{content:"";position:absolute;left:4px;top:4px;width:21px;height:21px;border-radius:50%;background:white;transition:.2s}.toggle:checked{background:#18ba9d}.toggle:checked:before{transform:translateX(21px)}.optional{margin-top:17px}.optional[hidden]{display:none}.result{border:1px solid #2fdab7;border-radius:25px;padding:23px 20px;background:linear-gradient(155deg,#153c3d,#0c252c 65%,#0d1d26);box-shadow:0 0 35px #12b99517}.result .caption{font-size:12px;color:#9bc9c8;letter-spacing:2px;font-weight:800}.big{font-size:clamp(38px,10vw,57px);font-weight:850;letter-spacing:-2px;margin:9px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}.readable{color:#72edce;font-size:14px;font-weight:650;margin-bottom:22px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid #33565a;background:#0b232a;border-radius:15px;padding:13px}.stat span{display:block;font-size:11px;color:#8eaeb4}.stat strong{display:block;font-size:18px;margin-top:6px;font-variant-numeric:tabular-nums}.finish{margin-top:11px;padding:17px;border:1px solid #386d67;border-radius:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}.finish span{color:#a6c4c7;font-size:13px}.finish strong{font-size:24px;font-variant-numeric:tabular-nums}.note{font-size:11px;color:#78929b;text-align:center;margin:17px 0}.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:2px;width:87%;height:68px;border:1px solid #385c61;background:#13252deF;backdrop-filter:blur(20px);border-radius:23px;display:flex;gap:10px;padding:9px;box-shadow:0 10px 35px #0009;z-index:20}.dock button{flex:1;border:0;border-radius:15px;font-weight:800;font-size:15px;background:#263d46;color:#d5e7e8}.dock .primary{background:linear-gradient(130deg,#4bf2c9,#1bb98d);color:#07211c}
</style></head><body><main class="app-shell"><div class="eyebrow">CNC / PRODUCTION TOOL</div><header class="header"><div class="logo">⏱</div><div><h1>Время<br>обработки</h1><div class="sub">Калькулятор производственной партии</div></div></header><section class="panel"><p class="panel-title">01 / Параметры партии</p><div class="field"><label>Время на одну деталь</label><div class="time-row"><div><input id="h" type="number" min="0" inputmode="numeric" placeholder="00"><div class="unit">ЧАСЫ</div></div><div><input id="m" type="number" min="0" inputmode="numeric" placeholder="00"><div class="unit">МИНУТЫ</div></div><div><input id="s" type="number" min="0" inputmode="numeric" placeholder="00"><div class="unit">СЕКУНДЫ</div></div></div></div><div class="field qty"><label for="q">Количество деталей, шт.</label><input id="q" type="number" min="0" step="1" inputmode="numeric" placeholder="Введите количество"></div><div class="toggle-line"><label for="change">Учитывать смену заготовки</label><input class="toggle" type="checkbox" id="change"></div><div class="field optional" id="optional" hidden><label>Время одной смены заготовки</label><div class="time-row"><div><input id="ch" type="number" min="0" inputmode="numeric" placeholder="00"><div class="unit">ЧАСЫ</div></div><div><input id="cm" type="number" min="0" inputmode="numeric" placeholder="00"><div class="unit">МИНУТЫ</div></div><div><input id="cs" type="number" min="0" inputmode="numeric" placeholder="00"><div class="unit">СЕКУНДЫ</div></div></div></div></section><section class="result" aria-live="polite"><div class="caption">ОБЩЕЕ ВРЕМЯ</div><div class="big" id="total">00:00:00</div><div class="readable" id="readable">Укажите параметры партии</div><div class="stats"><div class="stat"><span>Чистая обработка</span><strong id="cut">00:00:00</strong></div><div class="stat"><span>Смена заготовок</span><strong id="swaps">00:00:00</strong></div></div><div class="finish"><span>🏁 Закончу в</span><strong id="finish">—</strong></div></section><p class="note">Смена заготовок считается между деталями: N − 1</p></main><nav class="dock"><button id="reset">↺ Сброс</button><button class="primary" id="recalc">↻ Обновить</button></nav><script>
const ids=['h','m','s','q','ch','cm','cs'];const $=id=>document.getElementById(id);const val=id=>Math.max(0,Number($(id).value)||0);const fmt=n=>{n=Math.floor(n);return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(v=>String(v).padStart(2,'0')).join(':')};const human=n=>{let h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return [h?h+' ч':null,m?m+' мин':null,s?s+' сек':null].filter(Boolean).join(' ')||'0 секунд'};function calc(){const q=Math.floor(val('q')),per=val('h')*3600+val('m')*60+val('s'),change=$('change').checked?(val('ch')*3600+val('cm')*60+val('cs'))*Math.max(0,q-1):0,cut=per*q,total=cut+change;$('total').textContent=fmt(total);$('cut').textContent=fmt(cut);$('swaps').textContent=fmt(change);$('readable').textContent=q&&per?human(total):'Укажите параметры партии';$('finish').textContent=q&&per?new Date(Date.now()+total*1000).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'—'}ids.forEach(id=>$(id).addEventListener('input',calc));$('change').addEventListener('change',()=>{$('optional').hidden=!$('change').checked;calc()});$('reset').onclick=()=>{ids.forEach(id=>$(id).value='');$('change').checked=false;$('optional').hidden=true;calc()};$('recalc').onclick=calc;calc();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
